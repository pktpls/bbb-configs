ipv6_prefix: 2001:bf7:820:3400::/56

networks:
  - vid: 20
    role: mesh
    name: mesh_lan
    prefix: 10.248.33.80/32
    ipv6_subprefix: -1

  - vid: 42
    role: mgmt
    prefix: 10.248.33.64/29
    gateway: 1
    dns: 1
    ipv6_subprefix: 42
    assignments:
      podtwo: 1

  - role: podman
    ifname: podman0
    untagged: true
    inbound_filtering: true
    prefix: 10.248.33.72/29
    ipv6_subprefix: 2
    assignments:
      mirror: 2
