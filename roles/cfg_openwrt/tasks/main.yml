---

- name: Prepare directories variables
  set_fact:
    configs_dir: "{{ playbook_dir }}/tmp/configs/{{ inventory_hostname }}"
    dl_dir: "{{ playbook_dir }}/tmp/dl"
    build_dir: "{{ playbook_dir }}/tmp/build/{{ inventory_hostname }}"
    images_dir: "{{ playbook_dir }}/tmp/images"
    wikiupdater_dir: "{{ playbook_dir }}/tmp/wikiupdater"
  tags: always

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "755"
  tags: always
  loop:
    - "{{ configs_dir }}"
    - "{{ dl_dir }}"
    - "{{ build_dir }}"
    - "{{ images_dir }}"
    - "{{ wikiupdater_dir }}"

- name: Include tasks for conditional packages
  include_tasks:
    file: conditional_packages.yml
    apply:
      tags: always
  tags: always

- name: Debug hostvars before merge_vars
  copy:
    dest: "{{ images_dir }}/{{ inventory_hostname }}.early.json"
    content: "{{ hostvars[inventory_hostname] | rejectattr('key','matches','__to_merge') to_json(indent=2) }}"

- name: Include tasks for merging variables
  include_tasks:
    file: merge_vars.yml
    apply:
      tags: always
  tags: always

- name: Debug hostvars after merge_vars
  copy:
    dest: "{{ images_dir }}/{{ inventory_hostname }}.final.json"
    content: "{{ hostvars[inventory_hostname] | to_json(indent=2) }}"

- name: Create directory
  file:
    path: "{{ configs_dir }}"
    state: directory
    mode: "755"
  tags: always

- name: Include render_etc.yml
  include_tasks:
    file: render_etc.yml
    apply:
      tags: always
  tags: always

- name: Include add_symlinks.yml
  include_tasks:
    file: add_symlinks.yml
    apply:
      tags: always
  tags: always

- name: "Make sure /lib/firmware is present"
  file:
    dest: "{{ configs_dir }}/lib/firmware/ath10k"
    state: directory
    recurse: true
  when: ath10k_ct_fwcfg is defined
  tags: always

- name: "Configure ath10k-ct driver"
  copy:
    dest: "{{ configs_dir }}/lib/firmware/ath10k/fwcfg-{{ item.id }}.txt"
    content: "{{ item.config }}"
    mode: "644"
  loop: "{{ ath10k_ct_fwcfg | default([]) }}"
  tags: always

- name: Include fix_permissions.yml
  include_tasks:
    file: fix_permissions.yml
    apply:
      tags: always
  tags: always

- name: Generate Imagebuilder command
  set_fact:
    make_command: >
      make image
      PROFILE='{{ override_target | default(model) }}'
      PACKAGES='{{ packages | join(" ") }}'
      DISABLED_SERVICES='{{ disabled_services | join(" ") }}'
      FILES='{{ configs_dir }}' 1>&2

- name: Debug Imagebuilder command
  debug:
    var: make_command

- name: Include image generation
  include_tasks:
    file: imagebuilder.yml
    apply:
      tags: always
  tags:
    - never
    - image
    - flash

- name: Include image flash
  include_tasks:
    file: flash.yml
    apply:
      tags: always
  tags:
    - never
    - flash
  when: ipv6_prefix is defined

- name: Include wikiupdater
  include_tasks:
    file: wikiupdater.yml
    apply:
      tags: wiki
  when: inventory_hostname == groups[group_names[0]][0]
  tags:
    - never
    - wiki
